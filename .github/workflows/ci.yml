name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nestorawelle/juice-shop
  IMAGE_TAG: tagname
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v5
      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies and build application
        continue-on-error: true
        run: npm ci
      - name: Run frontend tests
        continue-on-error: true
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --source-map=false --browsers=ChromeHeadless
      - name: Run server tests
        continue-on-error: true
        run: npm run test:server

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out repository and history
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan current source for secrets
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --verbose
      - name: Scan Git history for secrets
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  njsscan:
    name: njsscan Node.js security scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v5
      - name: Set up Python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install njsscan
        continue-on-error: true
        run: python -m pip install njsscan
      - name: Scan Node.js source
        continue-on-error: true
        run: njsscan .

  semgrep:
    name: Semgrep JavaScript and TypeScript scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v5
      - name: Scan source with Semgrep
        continue-on-error: true
        run: |
          semgrep scan --config p/javascript --config p/typescript \
            --config p/nodejs --metrics=off --error

  retirejs:
    name: Retire.js dependency scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v5
      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Install server dependencies without lifecycle scripts
        continue-on-error: true
        run: npm ci --ignore-scripts
      - name: Install frontend dependencies without lifecycle scripts
        continue-on-error: true
        run: npm ci --prefix frontend --ignore-scripts --legacy-peer-deps
      - name: Install Retire.js
        continue-on-error: true
        run: npm install --global retire
      - name: Scan JavaScript dependencies
        continue-on-error: true
        run: retire --path .

  build:
    name: Build and publish Docker image
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: credentials
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is missing. Add a Docker Hub token for nestorawelle with write permission in repository Actions secrets."
            exit 1
          fi
      - name: Log in to Docker Hub
        id: login
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: nestorawelle
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image and push when authenticated
        id: image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Show Docker publishing result
        continue-on-error: true
        if: always()
        env:
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          {
            echo '## Docker Hub publishing'
            if [ "$LOGIN_OUTCOME" = success ] && [ "$IMAGE_OUTCOME" = success ] && [ -n "$IMAGE_DIGEST" ]; then
              echo "Published: $IMAGE_NAME:$IMAGE_TAG"
              echo "Digest: $IMAGE_DIGEST"
              echo 'View tags: https://hub.docker.com/r/nestorawelle/juice-shop/tags'
            else
              echo '**Image was NOT published.**'
              echo "Docker Hub login: $LOGIN_OUTCOME"
              echo "Docker image build/push: $IMAGE_OUTCOME"
              echo 'Check the credentials, login, and build steps above. A green workflow does not confirm publication because job failures are tolerated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
