name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nestorawelle/juice-shop
  DOCKERHUB_USERNAME: nestorawelle

jobs:
  # ---------------------------------------------------------------
  # 1. TESTS - blocking. If tests fail, the image is NOT published.
  # ---------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x
          cache: npm
          cache-dependency-path: |
            package.json
            frontend/package.json

      - name: Install dependencies and build application
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run frontend tests
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --source-map=false --browsers=ChromeHeadless

      - name: Run server tests
        run: npm run test:server

  # ---------------------------------------------------------------
  # 2. SECURITY SCANS - non-blocking (job-level continue-on-error).
  #    A scan that finds issues shows as a FAILED job (visible),
  #    but the pipeline keeps going. Results go to:
  #      - Security tab > Code scanning (SARIF)
  #      - Run page > Artifacts (downloadable reports)
  # ---------------------------------------------------------------

  # 2a. Secrets: Gitleaks (current files + full Git history)
  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks binary
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan Git history for secrets
        run: |
          gitleaks git . --redact --verbose \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Scan current source for secrets
        if: always()
        run: |
          gitleaks dir . --redact --verbose \
            --report-format sarif --report-path gitleaks-dir.sarif

      - name: Upload history results to Security tab
        if: always() && hashFiles('gitleaks-history.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks-history

      - name: Upload source results to Security tab
        if: always() && hashFiles('gitleaks-dir.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-dir.sarif
          category: gitleaks-source

      - name: Save Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          if-no-files-found: warn

  # 2b. SAST: njsscan (Node.js-specific patterns)
  njsscan:
    name: njsscan Node.js security scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install njsscan
        run: python -m pip install njsscan

      - name: Scan Node.js source
        run: njsscan --sarif -o njsscan.sarif .

      - name: Upload results to Security tab
        if: always() && hashFiles('njsscan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: njsscan.sarif
          category: njsscan

      - name: Save njsscan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan-report
          path: njsscan.sarif
          if-no-files-found: warn

  # 2c. SAST: Semgrep (JavaScript, TypeScript, Node.js rulesets)
  semgrep:
    name: Semgrep JavaScript and TypeScript scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source with Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --metrics=off \
            --error \
            --sarif --output semgrep.sarif

      - name: Upload results to Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: warn

  # 2d. SCA: Retire.js (known-vulnerable JavaScript libraries)
  retirejs:
    name: Retire.js dependency scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - name: Install server dependencies without lifecycle scripts
        run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi

      - name: Install frontend dependencies without lifecycle scripts
        run: if [ -f frontend/package-lock.json ]; then npm ci --prefix frontend --ignore-scripts --legacy-peer-deps; else npm install --prefix frontend --ignore-scripts --legacy-peer-deps; fi

      - name: Install Retire.js
        run: npm install --global retire

      - name: Scan JavaScript dependencies
        run: retire --path . --outputformat json --outputpath retire-report.json

      - name: Write findings count to run summary
        if: always()
        run: |
          {
            echo '## Retire.js'
            if [ -f retire-report.json ]; then
              COUNT=$(jq '[.data[]?.results[]?.vulnerabilities[]?] | length' retire-report.json 2>/dev/null || echo "unknown")
              echo "Vulnerable library findings: $COUNT"
              echo 'Full report: download the retirejs-report artifact.'
            else
              echo 'No report produced. Check the scan step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Retire.js report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirejs-report
          path: retire-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 3. BUILD & PUBLISH - fails loudly. No continue-on-error anywhere.
  #    Runs only if tests pass, and never on pull requests.
  # ---------------------------------------------------------------
  build:
    name: Build and publish Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fail fast if Docker Hub token is missing
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify image exists in Docker Hub
        run: docker buildx imagetools inspect "${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"

      - name: Write publishing result to run summary
        run: |
          {
            echo '## Docker Hub publishing'
            echo "Published: ${IMAGE_NAME}:latest and ${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "Digest: ${{ steps.image.outputs.digest }}"
            echo 'Tags: https://hub.docker.com/r/nestorawelle/juice-shop/tags'
          } >> "$GITHUB_STEP_SUMMARY"